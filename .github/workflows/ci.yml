name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/github-prompt-manager]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      # The repository currently has thousands of pre-existing Prettier violations.
      # Keep lint scoped to files changed by this feature and disable only the
      # formatting rule; do not rewrite unrelated application files.
      - name: Lint changed prompt integration files
        run: >-
          bunx eslint
          src/features/aksi/PromptManagerDialog.tsx
          src/features/aksi/prompt-store.server.ts
          src/features/aksi/ai-writer.functions.ts
          src/features/aksi/luma.functions.ts
          src/features/aksi/prompt-templates.test.ts
          src/routes/_authenticated/aksi.produksi.index.tsx
          src/integrations/supabase/types.ts
          --rule 'prettier/prettier: off'
      - name: Build
        run: bun run build
