name: Situasi Apify Ingestion

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      import_run_id:
        description: "Opsional: Run ID Apify SUCCEEDED yang dataset-nya ingin diimpor tanpa menjalankan Actor baru"
        required: false
        type: string

concurrency:
  group: situasi-apify-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Apify ingestion secret
        env:
          INGEST_SECRET: ${{ secrets.SITUASI_APIFY_INGEST_SECRET }}
        run: |
          if [ -z "$INGEST_SECRET" ]; then
            echo "::error::Tambahkan SITUASI_APIFY_INGEST_SECRET pada GitHub Actions secrets."
            exit 1
          fi
      - name: Run Apify ingestion pipeline
        env:
          INGEST_SECRET: ${{ secrets.SITUASI_APIFY_INGEST_SECRET }}
          IMPORT_RUN_ID: ${{ inputs.import_run_id }}
        run: |
          if [ -n "$IMPORT_RUN_ID" ]; then
            BODY=$(jq -cn --arg run_id "$IMPORT_RUN_ID" '{category:"news",actorId:"mastertools/google-news-scraper",importRunId:$run_id}')
          else
            BODY='{"category":"news","actorId":"mastertools/google-news-scraper"}'
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            --request POST \
            --header "x-apify-ingest-secret: $INGEST_SECRET" \
            --header "content-type: application/json" \
            --data "$BODY" \
            "https://kaafosgeoxcqeidtzblq.supabase.co/functions/v1/situasi-apify-ingest"
