name: Situasi RSS Ingestion

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: situasi-rss-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Validate ingestion secret
        env:
          INGEST_SECRET: ${{ secrets.SITUASI_RSS_INGEST_SECRET }}
        run: |
          if [ -z "$INGEST_SECRET" ]; then
            echo "::error::Tambahkan SITUASI_RSS_INGEST_SECRET pada GitHub Actions secrets."
            exit 1
          fi
      - name: Run RSS ingestion
        env:
          INGEST_SECRET: ${{ secrets.SITUASI_RSS_INGEST_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --header "x-ingest-secret: $INGEST_SECRET" \
            --header "content-type: application/json" \
            --data '{}' \
            "https://kaafosgeoxcqeidtzblq.supabase.co/functions/v1/situasi-rss-ingest"
